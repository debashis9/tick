<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Tick</title>
  <meta name="description" content="A simple habit tracker. Tap a habit to tick it. Everything stays on your device.">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F4F5F2">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0D0F0E">
  <meta name="color-scheme" content="light dark">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Tick">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preload" href="fonts/figtree-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="styles.css">
  <script>
    // Apply the saved theme before first paint (mirrored from settings by js/theme.js).
    try { var t = localStorage.getItem('tick.theme'); if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t); } catch (e) {}
  </script>
  <script src="js/vendor/qrcode.min.js" defer></script>
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <div class="app">
    <nav class="nav" aria-label="Main">
      <div class="nav-brand"><span class="logo"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span>tick</div>
      <button class="nav-item" type="button" data-tab="today" aria-current="page">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M8 12.3l2.7 2.7L16 9.7"/></svg>Today
      </button>
      <button class="nav-item" type="button" data-tab="calendar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>Calendar
      </button>
      <button class="nav-item" type="button" data-tab="settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg>Settings
      </button>
      <p class="nav-foot">Everything you track stays on this device.</p>
    </nav>
    <main id="main">
      <section id="view-today" class="view" aria-label="Today"></section>
      <section id="view-calendar" class="view" aria-label="Calendar" hidden></section>
      <section id="view-settings" class="view" aria-label="Settings" hidden></section>
    </main>
  </div>
  <div id="toast" role="status" aria-live="polite" hidden></div>
  <noscript><p style="padding:24px">Tick needs JavaScript to run.</p></noscript>
</body>
</html>
